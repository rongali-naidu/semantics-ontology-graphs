<svg xmlns="http://www.w3.org/2000/svg" width="980" height="420" viewBox="0 0 980 420" role="img" aria-label="The three Apache Ossie documents"><title>The three Apache Ossie documents</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#667085"/></marker><marker id="arrow-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#667085"/></marker></defs><rect x="1" y="1" width="978" height="418" rx="14" fill="#ffffff" stroke="#D0D5DD" stroke-width="1"/><text x="28" y="38" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#1D2939">Apache Ossie: three documents</text><text x="28" y="60" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#667085">an ontology and a semantic model, joined by a mapping, and portable across 20+ tools</text><rect x="40" y="92" width="260" height="96" rx="10" fill="#EFEBFB" stroke="#5B45B0" stroke-width="1.5"/><text x="170.0" y="116" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#5B45B0">retail.ontology.yaml</text><text x="170.0" y="135" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1D2939">concepts · relationships</text><text x="170.0" y="152" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1D2939">derived_by · requires</text><text x="170.0" y="169" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1D2939">iri → OWL terms</text><rect x="360" y="92" width="260" height="96" rx="10" fill="#F2F4F7" stroke="#475467" stroke-width="1.5"/><text x="490.0" y="116" font-f