<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430" role="img" aria-label="Amazon Neptune architecture"><title>Amazon Neptune architecture</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#667085"/></marker><marker id="arrow-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#667085"/></marker></defs><rect x="1" y="1" width="978" height="428" rx="14" fill="#ffffff" stroke="#D0D5DD" stroke-width="1"/><text x="28" y="38" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#1D2939">Amazon Neptune Database</text><text x="28" y="60" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#667085">one cluster, two graph models, all endpoints on port 8182</text><rect x="24" y="76" width="932" height="330" rx="10" fill="#FCFCFD" stroke="#98A2B3" stroke-width="1.5" stroke-dasharray="6 4"/><text x="44" y="98" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#667085">your VPC</text><rect x="50" y="116" width="230" height="84" rx="10" fill="#E7EFFD" stroke="#2557C7" stroke-width="1.5"/><text x="165.0" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#2557C7">Clients</text><text x="165.0" y="159" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1D2939">EC2 · Lambda · notebook</text><text x="165.0" y="176" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1D2939">Gremlin · openCypher · SPARQL</text><rect x="360" y="106" width="260" height="56" rx="10" fill="#E3F4F3" stroke="#0B7477" stroke-width="1.5"/><text x="490.0" y="138.55" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#0B7477">cluster endpoint → writer</text><rect x="360" y="176" width="260" height="56" rx="10" fill="#E3F4F3" stroke="#0B7477" stroke-width="1.5"/><text x="490.0" y="208.55" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#0B7477">reader endpoint → ≤15 replicas</text><line x1="282" y1="150" x2="358" y2="134" stroke="#667085" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="282" y1="160" x2="358" y2="204" stroke="#667085" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="360" y="262" width="560" height="70" rx="10" fill="#E3F4F3" stroke="#0B7477" stroke-width="1.5"/><text x="640" y="290" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#0B7477">shared distributed storage</text><text x="640" y="312" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1D2939">quad indexes · 6 copies across 3 AZs · auto-grows</text><line x1="490" y1="234" x2="490" y2="260" stroke="#667085" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="680" y="106" width="240" height="126" rx="10" fill="#EFEBFB" stroke="#5B45B0" stroke-width="1.5"/><text x="800.0" y="130" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#5B45B0">Two models</text><text x="800.0" y="149" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1D2939">RDF → SPARQL</text><text x="800.0" y="166" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1D2939">property graph →</text><text x="800.0" y="183" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1D2939">Gremlin + openCypher</text><text x="800.0" y="200" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1D2939">(models don&#x27;t mix)</text><rect x="50" y="262" width="230" height="70" rx="10" fill="#F2F4F7" stroke="#475467" stroke-width="1.5"/><text x="165.0" y="286" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#475467">S3 + VPC endpoint</text><text x="165.0" y="305" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1D2939">bulk loader: 6 formats</text><line x1="282" y1="297" x2="358" y2="297" stroke="#667085" stroke-width="1.6" marker-end="url(#arrow)"/><text x="490" y="380" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#667085">IAM auth → SigV4 (service neptune-db) · Neptune Analytics for in-memory algorithms</text></svg>
