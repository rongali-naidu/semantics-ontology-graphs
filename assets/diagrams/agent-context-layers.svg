<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-label="What goes in the graph for a data agent, and what stays in the warehouse"><title>What goes in the graph for a data agent, and what stays in the warehouse</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#667085"/></marker><marker id="arrow-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#667085"/></marker></defs><rect x="1" y="1" width="998" height="558" rx="14" fill="#ffffff" stroke="#D0D5DD" stroke-width="1"/><text x="28" y="38" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#1D2939">At scale, the graph holds meaning, not terabytes of orders</text><text x="28" y="60" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#667085">a data agent plans with the context graph, computes with the semantic model, and reads facts from the warehouse</text><rect x="330" y="82" width="340" height="50" rx="10" fill="#E7EFFD" stroke="#2557C7" stroke-width="1.5"/><text x="500.0" y="112.075" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" text-anchor="middle" fill="#2557C7">Data agent (LLM + tools)</text><rect x="30" y="186" width="300" height="150" rx="10" fill="#EFEBFB" stroke="#5B45B0" stroke-width="1.5"/><text x="180.0" y="210" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" text-anchor="middle" fill="#5B45B0">Context graph (metadata KG)</text><text x="180.0" y="232" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1D2939">ontology concepts · glossary</text><text x="180.0" y="252" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1D2939">tables · columns · mappings</text><text x="180.0" y="272" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1D2939">metric references · lineage</text><text x="180.0" y="292" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1D2939">owners · example queries</text><text x="180" y="330" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#5B45B0" font-style="italic">thousands–millions of nodes</text><line x1="500" y1="134" x2="180" y2="184" stroke="#667085" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="150.6" y="154.5" width="138.8" height="18.5" rx="4" fill="#ffffff" opacity="0.92"/><text x="220" y="166" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1D2939">1. understand &amp; plan</text><rect x="350" y="186" width="300" height="150" rx="10" fill="#FDEFE3" stroke="#B45309" stroke-width="1.5"/><text x="500.0" y="210" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" text-anchor="middle" fill="#B45309">Semantic model</text><text x="500.0" y="232" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1D2939">metric definitions</text><text x="500.0" y="252" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1D2939">joins · grain · fan-out rules</text><text x="500.0" y="272" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1D2939">compiles to correct SQL</text><text x="500.0" y="292" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1D2939">(executable)</text><text x="500" y="330" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#B45309" font-style="italic">per domain; text files</text><line x1="500" y1="134" x2="500" y2="184" stroke="#667085" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="437.03999999999996" y="154.5" width="125.92000000000002" height="18.5" rx="4" fill="#ffffff" opacity="0.92"/><text x="500" y="166" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1D2939">2. compute numbers</text><rect x="670" y="186" width="300" height="150" rx="10" fill="#E3F4F3" stroke="#0B7477" stroke-width="1.5"/><text x="820.0" y="210" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" text-anchor="middle" fill="#0B7477">Entity graph (optional)</text><text x="820.0" y="232" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1D2939">customers · products · suppliers</text><text x="820.0" y="252" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1D2939">identities resolved across</text><text x="820.0" y="272" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1D2939">systems · relationships</text><text x="820.0" y="292" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1D2939">(master data, not transactions)</text><text x="820" y="330" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#0B7477" font-style="italic">millions of nodes</text><line x1="500" y1="134" x2="820" y2="184" stroke="#667085" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="704.16" y="154.5" width="151.68" height="18.5" rx="4" fill="#ffffff" opacity="0.92"/><text x="780" y="166" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1D2939">3. who / how connected</text><line x1="330" y1="262" x2="348" y2="262" stroke="#667085" stroke-width="1.6" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/><line x1="650" y1="262" x2="668" y2="262" stroke="#667085" stroke-width="1.6" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/><rect x="30" y="400" width="940" height="76" rx="10" fill="#F2F4F7" stroke="#475467" stroke-width="1.5"/><text x="500" y="428" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#475467">Warehouse / lakehouse: transactions stay here</text><text x="500" y="452" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1D2939">orders · order lines · events · terabytes   (graphs over tables: Spanner / BigQuery Graph, SQL/PGQ)</text><line x1="500" y1="338" x2="500" y2="398" stroke="#667085" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="485.34" y="360.5" width="29.32" height="18.5" rx="4" fill="#ffffff" opacity="0.92"/><text x="500" y="372" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#667085">SQL</text><line x1="820" y1="398" x2="820" y2="338" stroke="#667085" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrow)"/><rect x="765.72" y="361" width="108.56" height="18" rx="4" fill="#ffffff" opacity="0.92"/><text x="820" y="372" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#667085">load master data</text><line x1="180" y1="398" x2="180" y2="338" stroke="#667085" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/><rect x="101.08" y="361" width="157.84" height="18" rx="4" fill="#ffffff" opacity="0.92"/><text x="180" y="372" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#667085">virtual KG: SPARQL → SQL</text><rect x="30" y="494" width="940" height="46" rx="10" fill="#FFF8E1" stroke="#9A6700" stroke-width="1.5"/><text x="500" y="522" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1D2939">the retail example loads everything into the graph only because it is tiny (165 triples); at scale, don&#x27;t</text></svg>
