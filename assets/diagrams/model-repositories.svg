<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-label="Metadata repository vs source repository"><title>Metadata repository vs source repository</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#667085"/></marker><marker id="arrow-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#667085"/></marker></defs><rect x="1" y="1" width="998" height="418" rx="14" fill="#ffffff" stroke="#D0D5DD" stroke-width="1"/><text x="28" y="38" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#1D2939">Where a semantic model is stored and promoted</text><text x="28" y="60" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#667085">the industry is moving from tool-managed repositories to text files in a git repo you own</text><text x="30" y="98" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#475467">Tool-managed metadata repository</text><rect x="30" y="112" width="210" height="64" rx="10" fill="#F2F4F7" stroke="#475467" stroke-width="1.5"/><text x="135.0" y="136" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#475467">Developer</text><text x="135.0" y="155" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1D2939">desktop admin tool</text><rect x="275" y="112" width="210" height="64" rx="10" fill="#F2F4F7" stroke="#475467" stroke-width="1.5"/><text x="380.0" y="136" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#475467">Binary model</text><text x="380.0" y="155" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1D2939">.rpd · .unx · .pbix</text><line x1="242" y1="144" x2="273" y2="144" stroke="#667085" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="520" y="112" width="210" height="64" rx="10" fill="#F2F4F7" stroke="#475467" stroke-width="1.5"/><text x="625.0" y="136" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#475467">BI server repository</text><text x="625.0" y="155" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1D2939">database inside the tool</text><line x1="487" y1="144" x2="518" y2="144" stroke="#667085" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="765" y="112" width="210" height="64" rx="10" fill="#F2F4F7" stroke="#475467" stroke-width="1.5"/><text x="870.0" y="136" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#475467">Promote</text><text x="870.0" y="155" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1D2939">upload · Object Manager · LCM</text><line x1="732" y1="144" x2="763" y2="144" stroke="#667085" stroke-width="1.6" marker-end="url(#arrow)"/><text x="30" y="228" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start" fill="#2E7D32">User-defined git repository (model as code)</text><rect x="30" y="242" width="210" height="64" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5"/><text x="135.0" y="266" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#2E7D32">Developer branch</text><text x="135.0" y="285" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1D2939">TMDL · SMML · LookML · YAML</text><rect x="275" y="242" width="210" height="64" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5"/><text x="380.0" y="266" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#2E7D32">Pull request + CI</text><text x="380.0" y="285" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1D2939">diff · review · validate</text><line x1="242" y1="274" x2="273" y2="274" stroke="#667085" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="520" y="242" width="210" height="64" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5"/><text x="625.0" y="266" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#2E7D32">main</text><text x="625.0" y="285" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1D2939">single source of truth</text><line x1="487" y1="274" x2="518" y2="274" stroke="#667085" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="765" y="242" width="210" height="64" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5"/><text x="870.0" y="266" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#2E7D32">Deploy</text><text x="870.0" y="285" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1D2939">dev → test → prod</text><line x1="732" y1="274" x2="763" y2="274" stroke="#667085" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="30" y="330" width="940" height="64" rx="10" fill="#FFF8E1" stroke="#9A6700" stroke-width="1.5"/><text x="500" y="356" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1D2939">Git-native today: Oracle Analytics Semantic Modeler · Power BI PBIP + Fabric Git · Looker · ThoughtSpot · dbt · Cube · AtScale · Ossie</text><text x="500" y="378" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1D2939">Tool-managed: classic Oracle RPD (MDS XML export) · BusinessObjects CMS · Cognos Content Store · MicroStrategy · Tableau Server</text></svg>
