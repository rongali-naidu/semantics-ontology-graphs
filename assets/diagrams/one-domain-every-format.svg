<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-label="One domain, every format"><title>One domain, every format</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#667085"/></marker><marker id="arrow-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#667085"/></marker></defs><rect x="1" y="1" width="998" height="438" rx="14" fill="#ffffff" stroke="#D0D5DD" stroke-width="1"/><text x="28" y="38" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#1D2939">One domain, every format</text><text x="28" y="60" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#667085">rdf/retail-data.ttl is the only hand-edited data file; CI proves every format gives the same answers</text><rect x="390" y="84" width="220" height="64" rx="10" fill="#E7EFFD" stroke="#2557C7" stroke-width="1.5"/><text x="500.0" y="108" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#2557C7">retail-data.ttl</text><text x="500.0" y="127" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1D2939">+ retail-ontology.ttl (OWL)</text><rect x="30" y="196" width="220" height="114" rx="10" fill="#EFEBFB" stroke="#5B45B0" stroke-width="1.5"/><text x="140.0" y="220" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#5B45B0">RDF formats</text><text x="140.0" y="239" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1D2939">N-Triples · N-Quads · TriG</text><text x="140.0" y="256" font-family="