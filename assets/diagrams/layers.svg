<svg xmlns="http://www.w3.org/2000/svg" width="960" height="452" viewBox="0 0 960 452" role="img" aria-label="Ontology, knowledge graph, data model, graph database"><title>Ontology, knowledge graph, data model, graph database</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#667085"/></marker><marker id="arrow-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#667085"/></marker></defs><rect x="1" y="1" width="958" height="450" rx="14" fill="#ffffff" stroke="#D0D5DD" stroke-width="1"/><text x="28" y="38" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#1D2939">Four layers that get mixed up</text><text x="28" y="60" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#667085">ontology ≠ knowledge graph ≠ graph data model ≠ graph database</text><text x="470" y="88" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start" fill="#667085" font-style="italic">in the retail example</text><rect x="30" y="96" width="900" height="76" rx="10" fill="#EFEBFB" stroke="#5B45B0" stroke-width="1.5"/><text x="50" y="128" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#5B45B0">Ontology</text><text x="50" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#667085">the meaning: classes, relationships, rules</text><text x="470" y="128" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#1D2939">Orders are placed by exactly one Customer;</text><text x="470" y="148" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#1D2939">subCategoryOf is transitive</text><rect x="30" y="182" width="900" height="76" rx="10" fill="#E3F4F3" stroke="#0B7477" stroke-width="1.5"/><text x="50" y="214" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#0B7477">Knowledge graph</text><text x="50" y="236" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#667085">ontology + facts (+ inferences)</text><text x="470" y="214" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#1D2939">O1 placedBy Alice; Alice is a PremiumCustomer</text><text x="470" y="234" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#1D2939">⇒ Alice is a Customer</text><rect x="30" y="268" width="900" height="76" rx="10" fill="#E7EFFD" stroke="#2557C7" stroke-width="1.5"/><text x="50" y="300" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#2557C7">Graph data model</text><text x="50" y="322" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#667085">how the graph is represented</text><text x="470" y="300" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#1D2939">RDF triples (subject–predicate–object)</text><text x="470" y="320" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#1D2939">or labeled property graph (nodes, edges, props)</text><rect x="30" y="354" width="900" height="76" rx="10" fill="#F2F4F7" stroke="#475467" stroke-width="1.5"/><text x="50" y="386" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#475467">Graph database</text><text x="50" y="408" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#667085">software that stores and queries it</text><text x="470" y="386" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#1D2939">Neptune · Neo4j · Spanner Graph · Oracle</text><text x="470" y="406" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#1D2939">GraphDB · Jena · Fabric Graph …</text></svg>
