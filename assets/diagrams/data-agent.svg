<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-label="What a data agent needs"><title>What a data agent needs</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#667085"/></marker><marker id="arrow-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#667085"/></marker></defs><rect x="1" y="1" width="998" height="518" rx="14" fill="#ffffff" stroke="#D0D5DD" stroke-width="1"/><text x="28" y="38" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#1D2939">A data agent needs context, not just SQL access</text><text x="28" y="60" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#667085">each component answers a different kind of question</text><rect x="250" y="80" width="500" height="56" rx="10" fill="#E7EFFD" stroke="#2557C7" stroke-width="1.5"/><text x="500.0" y="112.725" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" text-anchor="middle" fill="#2557C7">&quot;Why did premium Electronics revenue drop, and who are those customers?&quot;</text><rect x="380" y="160" width="240" height="56" rx="10" fill="#F2F4F7" stroke="#475467" stroke-width="1.5"/><text x="500.0" y="192.9" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#475467">Data agent (LLM + tools)</text><line x1="500" y1="136" x2="500" y2="158" stroke="#667085" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="30" y="252" width="205" height="128" rx="10" fill="#FDEFE3" stroke="#B45309" stroke-width="1.5"/><text x="132" y="278" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#B45309">Semantic model</text><text x="132" y="299" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1D2939" font-style="italic">how much? how many?</text><text x="132" y="326" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#667085">governed metrics · joins</text><text x="132" y="344" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#667085">revenue = Σ qty × price</text><line x1="500" y1="218" x2="132" y2="250" stroke="#667085" stroke-width="1.6" stroke-dasharray="3 3" marker-end="url(#arrow)"/><rect x="275" y="252" width="205" height="128" rx="10" fill="#EFEBFB" stroke="#5B45B0" stroke-width="1.5"/><text x="377" y="278" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#5B45B0">Ontology</text><text x="377" y="299" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1D2939" font-style="italic">what does it mean?</text><text x="377" y="326" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#667085">vocabulary · synonyms</text><text x="377" y="344" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#667085">premium ⊑ customer</text><line x1="500" y1="218" x2="377" y2="250" stroke="#667085" stroke-width="1.6" stroke-dasharray="3 3" marker-end="url(#arrow)"/><rect x="520" y="252" width="205" height="128" rx="10" fill="#E3F4F3" stroke="#0B7477" stroke-width="1.5"/><text x="622" y="278" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#0B7477">Knowledge graph</text><text x="622" y="299" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1D2939" font-style="italic">who? how connected?</text><text x="622" y="326" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#667085">entities · paths · provenance</text><text x="622" y="344" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#667085">Alice → O3 → Earbuds</text><line x1="500" y1="218" x2="622" y2="250" stroke="#667085" stroke-width="1.6" stroke-dasharray="3 3" marker-end="url(#arrow)"/><rect x="765" y="252" width="205" height="128" rx="10" fill="#F2F4F7" stroke="#475467" stroke-width="1.5"/><text x="867" y="278" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#475467">Documents</text><text x="867" y="299" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1D2939" font-style="italic">why?</text><text x="867" y="326" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#667085">policies · definitions</text><text x="867" y="344" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#667085">RAG retrieval</text><line x1="500" y1="218" x2="867" y2="250" stroke="#667085" stroke-width="1.6" stroke-dasharray="3 3" marker-end="url(#arrow)"/><rect x="30" y="408" width="940" height="46" rx="10" fill="#F9FAFB" stroke="#D0D5DD" stroke-width="1.5"/><text x="500" y="436" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1D2939">same data underneath: warehouse tables · graph store · documents (linked by IRIs and mappings)</text><text x="500" y="488" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#667085" font-style="italic">start with the semantic model for numbers · add the ontology when vocabulary diverges · add the KG for relationships</text><line x1="132" y1="382" x2="132" y2="406" stroke="#98A2B3" stroke-width="1.6"/><line x1="377" y1="382" x2="377" y2="406" stroke="#98A2B3" stroke-width="1.6"/><line x1="622" y1="382" x2="622" y2="406" stroke="#98A2B3" stroke-width="1.6"/><line x1="867" y1="382" x2="867" y2="406" stroke="#98A2B3" stroke-width="1.6"/></svg>
