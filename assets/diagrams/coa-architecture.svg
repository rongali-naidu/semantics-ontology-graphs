<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-label="AWS Context Ontology Accelerator architecture"><title>AWS Context Ontology Accelerator architecture</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#667085"/></marker><marker id="arrow-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#667085"/></marker></defs><rect x="1" y="1" width="998" height="468" rx="14" fill="#ffffff" stroke="#D0D5DD" stroke-width="1"/><text x="28" y="38" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#1D2939">AWS Context Ontology Accelerator: Scan → Model → Serve</text><text x="28" y="60" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#667085">open source (Apache 2.0), deployed into your AWS account with CDK</text><rect x="30" y="84" width="290" height="196" rx="10" fill="#F2F4F7" stroke="#475467" stroke-width="1.5"/><text x="175.0" y="108" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="middle" fill="#475467">Scan</text><text x="175.0" y="131" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1D2939">data sources: Glue, JDBC,</text><text x="175.0" y="152" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1D2939">Databricks, Athena</text><text x="175.0" y="173" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1D2939">documents (unstructured)</text><text x="175.0" y="194" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1D2939">schema discovery</text><rect x="355" y="84" width="290" height="196" rx="10" fill="#EFEBFB" stroke="#5B45B0" stroke-width="1.5"/><text x="500.0" y="108" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="middle" fill="#5B45B0">Model</text><text x="500.0" y="131" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1D2939">induce OWL + R2RML (Bedrock)</text><text x="500.0" y="152" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1D2939">ground: FIBO, schema.org</text><text x="500.0" y="173" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1D2939">expert review &amp; approval</text><text x="500.0" y="194" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1D2939">reason: HermiT / ELK</text><text x="500.0" y="215" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1D2939">metrics (Tier 1)</text><line x1="322" y1="182" x2="353" y2="182" stroke="#667085" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="680" y="84" width="290" height="196" rx="10" fill="#FDEFE3" stroke="#B45309" stroke-width="1.5"/><text x="825.0" y="108" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="middle" fill="#B45309">Serve</text><text x="825.0" y="131" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1D2939">Tier 1: governed metric</text><text x="825.0" y="152" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1D2939">Tier 2: ontology (VKG via Ontop)</text><text x="825.0" y="173" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1D2939">     or NL-to-SQL</text><text x="825.0" y="194" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1D2939">Tier 3: documents + graph</text><text x="825.0" y="215" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1D2939">MCP: 6 tools for agents</text><line x1="647" y1="182" x2="678" y2="182" stroke="#667085" stroke-width="1.6" marker-end="url(#arrow)"/><text x="500" y="318" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#667085">AWS services underneath</text><rect x="30" y="334" width="176" height="50" rx="10" fill="#E3F4F3" stroke="#0B7477" stroke-width="1.5"/><text x="118.0" y="363.55" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#0B7477">Amazon Neptune</text><rect x="222" y="334" width="176" height="50" rx="10" fill="#F2F4F7" stroke="#475467" stroke-width="1.5"/><text x="310.0" y="363.55" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#475467">OpenSearch Serverless</text><rect x="414" y="334" width="176" height="50" rx="10" fill="#F2F4F7" stroke="#475467" stroke-width="1.5"/><text x="502.0" y="363.55" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#475467">Amazon Bedrock</text><rect x="606" y="334" width="176" height="50" rx="10" fill="#F2F4F7" stroke="#475467" stroke-width="1.5"/><text x="694.0" y="363.55" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#475467">AgentCore Runtime</text><rect x="798" y="334" width="176" height="50" rx="10" fill="#F2F4F7" stroke="#475467" stroke-width="1.5"/><text x="886.0" y="363.55" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#475467">Cognito · Cedar</text><rect x="30" y="404" width="940" height="46" rx="10" fill="#FFF8E1" stroke="#9A6700" stroke-width="1.5"/><text x="500" y="432" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1D2939">self-supported · ~16 CDK stacks · COA docs: Neptune + OpenSearch Serverless ≈ $930/month when idle</text></svg>
