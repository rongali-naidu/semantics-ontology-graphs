<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-label="How ontologies, knowledge graphs and semantic models work together"><title>How ontologies, knowledge graphs and semantic models work together</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#667085"/></marker><marker id="arrow-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#667085"/></marker></defs><rect x="1" y="1" width="958" height="478" rx="14" fill="#ffffff" stroke="#D0D5DD" stroke-width="1"/><text x="28" y="38" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#1D2939">Meaning, connections and numbers, together</text><text x="28" y="60" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#667085">the ontology names things once; the KG connects them; the semantic model counts them</text><rect x="290" y="82" width="380" height="70" rx="10" fill="#EFEBFB" stroke="#5B45B0" stroke-width="1.5"/><text x="480.0" y="106" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#5B45B0">Enterprise ontology</text><text x="480.0" y="125" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1D2939">OWL / Ossie ontology · IRIs · rules</text><rect x="40" y="212" width="380" height="92" rx="10" fill="#E3F4F3" stroke="#0B7477" stroke-width="1.5"/><text x="230.0" y="236" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#0B7477">Knowledge graph</text><text x="230.0" y="255" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1D2939">RDF store or property graph</text><text x="230.0" y="272" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1D2939">entities, paths, provenance</text><text x="230.0" y="289" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1D2939">who · what · how connected</text><rect x="540" y="212" width="380" height="92" rx="10" fill="#FDEFE3" stroke="#B45309" stroke-width="1.5"/><text x="730.0" y="236" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#B45309">Semantic models</text><text x="730.0" y="255" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1D2939">Ossie · dbt · LookML · TMDL · COA metrics</text><text x="730.0" y="272" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1D2939">governed metrics, dimensions, joins</text><text x="730.0" y="289" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1D2939">how much · how many</text><line x1="400" y1="152" x2="250" y2="210" stroke="#667085" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="199.51999999999998" y="167" width="200.96" height="18" rx="4" fill="#ffffff" opacity="0.92"/><text x="300" y="178" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#667085">mapping (R2RML · Ossie mapping)</text><line x1="560" y1="152" x2="710" y2="210" stroke="#667085" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="550.28" y="167" width="219.44000000000003" height="18" rx="4" fill="#ffffff" opacity="0.92"/><text x="660" y="178" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#667085">alignment (iri · ontologyConcepts)</text><rect x="280" y="368" width="400" height="72" rx="10" fill="#E7EFFD" stroke="#2557C7" stroke-width="1.5"/><text x="480.0" y="392" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#2557C7">AI agents · apps · BI</text><text x="480.0" y="411" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1D2939">&quot;why did premium Electronics revenue drop,</text><text x="480.0" y="428" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1D2939">and who are those customers?&quot;</text><line x1="230" y1="304" x2="380" y2="366" stroke="#667085" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="730" y1="304" x2="580" y2="366" stroke="#667085" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="40" y="368" width="200" height="72" rx="10" fill="#F2F4F7" stroke="#475467" stroke-width="1.5"/><text x="140.0" y="392" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#475467">Data</text><text x="140.0" y="411" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1D2939">warehouse tables</text><text x="140.0" y="428" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1D2939">documents</text><line x1="140" y1="366" x2="140" y2="306" stroke="#667085" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrow)"/><path d="M 140 440 V 456 H 940 V 258 H 924" fill="none" stroke="#667085" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrow)"/><rect x="733.4" y="449" width="133.20000000000002" height="18" rx="4" fill="#ffffff" opacity="0.92"/><text x="800" y="460" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#667085">same data feeds both</text></svg>
