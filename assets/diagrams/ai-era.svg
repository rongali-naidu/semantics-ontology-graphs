<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-label="Semantics and LLMs, both directions"><title>Semantics and LLMs, both directions</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#667085"/></marker><marker id="arrow-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#667085"/></marker></defs><rect x="1" y="1" width="998" height="468" rx="14" fill="#ffffff" stroke="#D0D5DD" stroke-width="1"/><text x="28" y="38" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#1D2939">Semantics and LLMs need each other</text><text x="28" y="60" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#667085">LLMs bring language and reasoning; semantics brings the enterprise&#x27;s meaning, facts and numbers</text><rect x="30" y="110" width="300" height="250" rx="10" fill="#E7EFFD" stroke="#2557C7" stroke-width="1.5"/><text x="180.0" y="134" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="middle" fill="#2557C7">LLMs / agents</text><text x="180.0" y="160" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1D2939">fluent language</text><text x="180.0" y="184" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1D2939">reasoning and planning</text><text x="180.0" y="208" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1D2939">tool calling (MCP)</text><text x="180.0" y="232" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1D2939"></text><text x="180.0" y="256" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1D2939">but: no built-in knowledge</text><text x="180.0" y="280" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1D2939">of YOUR terms, tables,</text><text x="180.0" y="304" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#1D2939">rules or numbers</text><rect x="670" y="110" width="300" height="250" rx="10" fill="#fff" stroke="#475467" stroke-width="1.5"/><text x="820" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#475467">Semantics</text><rect x="690" y="158" width="260" height="54" rx="10" fill="#EFEBFB" stroke="#5B45B0" stroke-width="1.5"/><text x="820" y="181" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#5B45B0">Ontology</text><text x="820" y="200" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1D2939">meaning · vocabulary · rules</text><rect x="690" y="222" width="260" height="54" rx="10" fill="#E3F4F3" stroke="#0B7477" stroke-width="1.5"/><text x="820" y="245" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#0B7477">Knowledge graph</text><text x="820" y="264" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1D2939">facts · connections · identity</text><rect x="690" y="286" width="260" height="54" rx="10" fill="#FDEFE3" stroke="#B45309" stroke-width="1.5"/><text x="820" y="309" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#B45309">Semantic model</text><text x="820" y="328" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1D2939">governed numbers</text><path d="M 668 175 C 560 150, 440 150, 332 175" fill="none" stroke="#2E7D32" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="440.4" y="122" width="119.20000000000002" height="20" rx="4" fill="#ffffff" opacity="0.92"/><text x="500" y="135" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#2E7D32">grounds the LLM</text><text x="500" y="172" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1D2939">exact meaning, fewer wrong terms</text><text x="500" y="191" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1D2939">facts, paths, provenance (GraphRAG)</text><text x="500" y="210" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1D2939">correct metrics (text-to-metric)</text><text x="500" y="229" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1D2939">guardrails: validate output (SHACL)</text><path d="M 332 300 C 440 330, 560 330, 668 300" fill="none" stroke="#B45309" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="418.56" y="337" width="162.88000000000002" height="20" rx="4" fill="#ffffff" opacity="0.92"/><text x="500" y="350" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#B45309">helps build semantics</text><text x="500" y="262" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1D2939">draft ontologies &amp; mappings (R2RML)</text><text x="500" y="281" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1D2939">align to FIBO / schema.org</text><text x="500" y="300" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1D2939">extract entities from text</text><rect x="30" y="392" width="940" height="54" rx="10" fill="#FFF8E1" stroke="#9A6700" stroke-width="1.5"/><text x="500" y="415" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#1D2939">the rule that keeps it safe:  LLM proposes  →  human approves  →  machine checks</text><text x="500" y="435" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#667085">(this repo&#x27;s CI: R2RML must reproduce the graph · SHACL must pass · every format gives the same answers)</text></svg>
