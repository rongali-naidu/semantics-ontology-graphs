<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-label="Schema plus data: ontology, instance graph, knowledge graph"><title>Schema plus data: ontology, instance graph, knowledge graph</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#667085"/></marker><marker id="arrow-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#667085"/></marker></defs><rect x="1" y="1" width="998" height="498" rx="14" fill="#ffffff" stroke="#D0D5DD" stroke-width="1"/><text x="28" y="38" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#1D2939">Schema + data = knowledge graph</text><text x="28" y="60" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#667085">what people usually mean by &quot;ontology&quot; and by &quot;the graph&quot;</text><rect x="30" y="82" width="430" height="196" rx="10" fill="#EFEBFB" stroke="#5B45B0" stroke-width="1.5"/><text x="245" y="108" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#5B45B0">Schema  =  the ontology</text><text x="245" y="128" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#667085">TBox: classes, properties, rules · changes slowly</text><text x="50" y="158" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start" fill="#1D2939">retail:PremiumCustomer rdfs:subClassOf</text><text x="108" y="177" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start" fill="#1D2939">retail:Customer .</text><text x="50" y="196" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start" fill="#1D2939">retail:placedBy rdfs:domain retail:Order ;</text><text x="108" y="215" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start" fill="#1D2939">rdfs:range retail:Customer .</text><text x="245" y="264" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#5B45B0">retail-ontology.ttl · 238 triples</text><text x="500" y="190" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" text-anchor="middle" fill="#667085">+</text><rect x="540" y="82" width="430" height="196" rx="10" fill="#E3F4F3" stroke="#0B7477" stroke-width="1.5"/><text x="755" y="108" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#0B7477">Data  =  &quot;the graph&quot; (instances)</text><text x="755" y="128" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#667085">ABox: individuals and facts · changes constantly</text><text x="560" y="158" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start" fill="#1D2939">ex:C1 a retail:PremiumCustomer ;</text><text x="604" y="177" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start" fill="#1D2939">retail:name &quot;Naidu Rongali&quot; .</text><text x="560" y="196" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start" fill="#1D2939">ex:O1 retail:placedBy ex:C1 ;</text><text x="604" y="215" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start" fill="#1D2939">retail:orderDate &quot;2026-09-01&quot; .</text><text x="755" y="264" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#0B7477">retail-data.ttl · 165 triples</text><line x1="245" y1="280" x2="440" y2="326" stroke="#667085" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="755" y1="280" x2="560" y2="326" stroke="#667085" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="250" y="328" width="500" height="82" rx="10" fill="#E7EFFD" stroke="#2557C7" stroke-width="1.5"/><text x="500" y="355" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#2557C7">=  Knowledge graph</text><text x="500" y="378" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1D2939">+ a reasoner adds what follows from the schema:</text><text x="500" y="398" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="12" font-weight="normal" text-anchor="middle" fill="#2557C7">ex:C1 a retail:Customer   (Naidu is a Customer)</text><rect x="30" y="428" width="940" height="50" rx="10" fill="#FFF8E1" stroke="#9A6700" stroke-width="1.5"/><text x="500" y="450" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1D2939">In RDF both halves are triples in one graph, so the line is a convention: formally an OWL ontology may include</text><text x="500" y="468" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1D2939">individuals too. This repo: ontology = schema · data = instance graph · knowledge graph = both.</text></svg>
