<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-label="What a semantic layer does"><title>What a semantic layer does</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#667085"/></marker><marker id="arrow-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#667085"/></marker></defs><rect x="1" y="1" width="958" height="438" rx="14" fill="#ffffff" stroke="#D0D5DD" stroke-width="1"/><text x="28" y="38" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#1D2939">A semantic layer defines each metric once</text><text x="28" y="60" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#667085">every consumer gets the same revenue, the same joins, the same security</text><rect x="40" y="82" width="205" height="62" rx="10" fill="#E7EFFD" stroke="#2557C7" stroke-width="1.5"/><text x="142.5" y="106" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#2557C7">Dashboards</text><text x="142.5" y="125" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1D2939">Power BI · Looker · Tableau</text><line x1="142" y1="146" x2="480" y2="194" stroke="#667085" stroke-width="1.6" stroke-dasharray="3 3" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/><rect x="265" y="82" width="205" height="62" rx="10" fill="#E7EFFD" stroke="#2557C7" stroke-width="1.5"/><text x="367.5" y="106" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#2557C7">Notebooks / SQL</text><text x="367.5" y="125" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1D2939">analysts, data science</text><line x1="367" y1="146" x2="480" y2="194" stroke="#667085" stroke-width="1.6" stroke-dasharray="3 3" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/><rect x="490" y="82" width="205" height="62" rx="10" fill="#E7EFFD" stroke="#2557C7" stroke-width="1.5"/><text x="592.5" y="106" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#2557C7">Spreadsheets</text><text x="592.5" y="125" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1D2939">Excel · Sheets</text><line x1="592" y1="146" x2="480" y2="194" stroke="#667085" stroke-width="1.6" stroke-dasharray="3 3" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/><rect x="715" y="82" width="205" height="62" rx="10" fill="#E7EFFD" stroke="#2557C7" stroke-width="1.5"/><text x="817.5" y="106" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#2557C7">AI agents</text><text x="817.5" y="125" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1D2939">text-to-metric · MCP</text><line x1="817" y1="146" x2="480" y2="194" stroke="#667085" stroke-width="1.6" stroke-dasharray="3 3" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/><rect x="60" y="196" width="840" height="112" rx="10" fill="#FDEFE3" stroke="#B45309" stroke-width="1.5"/><text x="480" y="222" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#B45309">Semantic model</text><text x="85" y="252" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="start" fill="#B45309">metric</text><text x="155" y="252" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start" fill="#1D2939">revenue = SUM(quantity × unit_price)</text><text x="485" y="252" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="start" fill="#B45309">metric</text><text x="555" y="252" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start" fill="#1D2939">average_order_value = revenue / order_count</text><text x="85" y="282" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="start" fill="#B45309">dimension</text><text x="155" y="282" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start" fill="#1D2939">customer · department · order month</text><text x="485" y="282" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="start" fill="#B45309">join</text><text x="555" y="282" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="12" font-weight="normal" text-anchor="start" fill="#1D2939">order_lines → orders → customers</text><rect x="70" y="350" width="140" height="54" rx="6" fill="#F2F4F7" stroke="#475467" stroke-width="1.5"/><text x="140" y="382" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1D2939">order_lines</text><line x1="140" y1="348" x2="480" y2="310" stroke="#667085" stroke-width="1.6" stroke-dasharray="3 3" marker-end="url(#arrow)"/><rect x="240" y="350" width="140" height="54" rx="6" fill="#F2F4F7" stroke="#475467" stroke-width="1.5"/><text x="310" y="382" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1D2939">orders</text><line x1="310" y1="348" x2="480" y2="310" stroke="#667085" stroke-width="1.6" stroke-dasharray="3 3" marker-end="url(#arrow)"/><rect x="410" y="350" width="140" height="54" rx="6" fill="#F2F4F7" stroke="#475467" stroke-width="1.5"/><text x="480" y="382" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1D2939">customers</text><line x1="480" y1="348" x2="480" y2="310" stroke="#667085" stroke-width="1.6" stroke-dasharray="3 3" marker-end="url(#arrow)"/><rect x="580" y="350" width="140" height="54" rx="6" fill="#F2F4F7" stroke="#475467" stroke-width="1.5"/><text x="650" y="382" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1D2939">products</text><line x1="650" y1="348" x2="480" y2="310" stroke="#667085" stroke-width="1.6" stroke-dasharray="3 3" marker-end="url(#arrow)"/><rect x="750" y="350" width="140" height="54" rx="6" fill="#F2F4F7" stroke="#475467" stroke-width="1.5"/><text x="820" y="382" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1D2939">categories</text><line x1="820" y1="348" x2="480" y2="310" stroke="#667085" stroke-width="1.6" stroke-dasharray="3 3" marker-end="url(#arrow)"/><text x="480" y="425" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#667085">warehouse tables (star schema)</text></svg>
