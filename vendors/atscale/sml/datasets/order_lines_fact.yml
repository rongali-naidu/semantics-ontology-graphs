# Fact dataset. SML datasets can be a table or a SQL query; the query adds the
# order header keys (customer_id, order_date) needed to join to dimensions.
unique_name: order_lines_fact
object_type: dataset
label: Order Lines
connection_id: Connection - Retail
sql: >-
  SELECT ol.order_line_id, ol.order_id, o.customer_id, ol.product_id, o.order_date,
         o.status, ol.quantity, ol.unit_price,
         ol.quantity * ol.unit_price AS line_amount,
         ol.quantity * (p.list_price - ol.unit_price) AS discount_amount
  FROM retail.order_lines ol
  JOIN retail.orders o   ON o.order_id = ol.order_id
  JOIN retail.products p ON p.product_id = ol.product_id
columns:
  - name: order_line_id
    data_type: string
  - name: order_id
    data_type: string
  - name: customer_id
    data_type: string
  - name: product_id
    data_type: string
  - name: order_date
    data_type: date
  - name: status
    data_type: string
  - name: quantity
    data_type: int
  - name: unit_price
    data_type: decimal(10,2)
  - name: line_amount
    data_type: decimal(10,2)
  - name: discount_amount
    data_type: decimal(10,2)
